<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - FinSync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body style="background-color: var(--bg-light);">
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-lg);">
    <div class="card" style="width: 100%; max-width: 450px; text-align: center; padding: var(--space-xl);">
      <a href="index.html" style="display: inline-block; margin-bottom: var(--space-xl);">
        <span style="font-size: 2rem; font-weight: 700; color: var(--primary);">Fin</span><span style="font-size: 2rem; font-weight: 700; color: var(--accent);">Sync</span>
      </a>
      
      <h1 style="font-size: 1.5rem; margin-bottom: var(--space-md); font-weight: 600;">Reset Your Password</h1>
      <p style="color: var(--text-secondary); margin-bottom: var(--space-xl);">
        Enter your email address and we'll send you a link to reset your password.
      </p>
      
      <!-- Request Reset Form -->
      <form id="resetForm" style="text-align: left;">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        
        <button type="submit" id="resetBtn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-lg);">
          Send Reset Link
        </button>
      </form>
      
      <!-- Success Message (initially hidden) -->
      <div id="successMessage" style="display: none; margin-top: var(--space-xl);">
        <div style="background-color: rgba(16, 185, 129, 0.1); border-radius: var(--radius-md); padding: var(--space-lg); margin-bottom: var(--space-lg);">
          <i class="fas fa-check-circle" style="color: var(--success); font-size: 2rem; margin-bottom: var(--space-md);"></i>
          <p style="color: var(--text-primary); margin-bottom: var(--space-sm);"><strong>Reset Link Sent!</strong></p>
          <p style="color: var(--text-secondary); margin-bottom: 0;">
            If an account exists for this email, a password reset link has been sent. Please check your inbox.
          </p>
        </div>
      </div>
      
      <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: var(--space-xl);">
        <a href="login.html" style="display: flex; align-items: center; justify-content: center;">
          <i class="fas fa-arrow-left" style="margin-right: var(--space-sm);"></i> Back to Login
        </a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const resetForm = document.getElementById('resetForm');
      const resetBtn = document.getElementById('resetBtn');
      const successMessage = document.getElementById('successMessage');
      
      resetForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // Show loading state
        resetBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Sending...';
        resetBtn.disabled = true;
        
        // Simulate API request
        setTimeout(() => {
          // Hide form, show success message
          resetForm.style.display = 'none';
          successMessage.style.display = 'block';
        }, 1500);
      });
    });
  </script>
</body>
</html>
