<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - FinSync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body style="background-color: var(--bg-light);">
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-lg);">
    <div class="card" style="width: 100%; max-width: 500px; text-align: center; padding: var(--space-xl);">
      <a href="index.html" style="display: inline-block; margin-bottom: var(--space-xl);">
        <span style="font-size: 2rem; font-weight: 700; color: var(--primary);">Fin</span><span style="font-size: 2rem; font-weight: 700; color: var(--accent);">Sync</span>
      </a>
      
      <h1 style="font-size: 1.5rem; margin-bottom: var(--space-md); font-weight: 600;">Create Your FinSync Account</h1>
      <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">Start your 14-day free trial. No credit card required.</p>
      
      <!-- Signup Form -->
      <form action="org-setup.html" class="needs-validation" style="text-align: left;">
        <div class="form-group">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="John Smith" required>
        </div>
        
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required pattern=".{8,}" title="Password must be at least 8 characters">
            <button type="button" class="password-toggle" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-light);">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div style="margin-top: var(--space-xs); font-size: 0.75rem; color: var(--text-light);">
            At least 8 characters
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div style="position: relative;">
            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
            <button type="button" class="password-toggle" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-light);">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        
        <div class="form-group">
          <div style="display: flex; align-items: flex-start;">
            <input type="checkbox" id="terms" style="margin-right: var(--space-sm); margin-top: 5px;" required>
            <label for="terms" style="color: var(--text-secondary); font-size: 0.875rem; line-height: 1.4;">
              I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a>
            </label>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: var(--space-lg);">Create Account</button>
      </form>
      
      <!-- Social Signup -->
      <div style="margin-bottom: var(--space-lg);">
        <div style="display: flex; align-items: center; margin-bottom: var(--space-md);">
          <div style="height: 1px; background-color: var(--border-light); flex: 1;"></div>
          <span style="padding: 0 var(--space-md); color: var(--text-light); font-size: 0.875rem;">OR</span>
          <div style="height: 1px; background-color: var(--border-light); flex: 1;"></div>
        </div>
        
        <button class="btn btn-outline" style="width: 100%; display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-md);">
          <img src="img/google-logo.svg" alt="Google" style="width: 18px; height: 18px; margin-right: var(--space-md);">
          Sign up with Google
        </button>
      </div>
      
      <p style="font-size: 0.875rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html">Log In</a>
      </p>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
