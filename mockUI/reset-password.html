<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - FinSync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body style="background-color: var(--bg-light);">
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-lg);">
    <div class="card" style="width: 100%; max-width: 450px; text-align: center; padding: var(--space-xl);">
      <a href="index.html" style="display: inline-block; margin-bottom: var(--space-xl);">
        <span style="font-size: 2rem; font-weight: 700; color: var(--primary);">Fin</span><span style="font-size: 2rem; font-weight: 700; color: var(--accent);">Sync</span>
      </a>
      
      <h1 style="font-size: 1.5rem; margin-bottom: var(--space-md); font-weight: 600;">Set Your New Password</h1>
      <p style="color: var(--text-secondary); margin-bottom: var(--space-xl);">
        Create a new password for your FinSync account.
      </p>
      
      <!-- Set New Password Form -->
      <form id="newPasswordForm" style="text-align: left;">
        <div class="form-group">
          <label for="newPassword" class="form-label">New Password</label>
          <div style="position: relative;">
            <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required pattern=".{8,}" title="Password must be at least 8 characters">
            <button type="button" class="password-toggle" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-light);">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div style="margin-top: var(--space-xs); font-size: 0.75rem; color: var(--text-light);">
            At least 8 characters
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <div style="position: relative;">
            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
            <button type="button" class="password-toggle" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-light);">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        
        <button type="submit" id="savePasswordBtn" class="btn btn-primary" style="width: 100%; margin-top: var(--space-lg);">
          Set New Password
        </button>
      </form>
      
      <!-- Success Message (initially hidden) -->
      <div id="successMessage" style="display: none; margin-top: var(--space-xl);">
        <div style="background-color: rgba(16, 185, 129, 0.1); border-radius: var(--radius-md); padding: var(--space-lg); margin-bottom: var(--space-lg);">
          <i class="fas fa-check-circle" style="color: var(--success); font-size: 2rem; margin-bottom: var(--space-md);"></i>
          <p style="color: var(--text-primary); margin-bottom: var(--space-sm);"><strong>Password Successfully Reset!</strong></p>
          <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">
            Your password has been updated. You can now log in with your new password.
          </p>
          <a href="login.html" class="btn btn-primary" style="width: 100%;">Go to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const newPasswordForm = document.getElementById('newPasswordForm');
      const savePasswordBtn = document.getElementById('savePasswordBtn');
      const successMessage = document.getElementById('successMessage');
      const newPassword = document.getElementById('newPassword');
      const confirmPassword = document.getElementById('confirmPassword');
      
      newPasswordForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        // Basic validation
        if (newPassword.value !== confirmPassword.value) {
          alert("Passwords don't match. Please try again.");
          return;
        }
        
        // Show loading state
        savePasswordBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...';
        savePasswordBtn.disabled = true;
        
        // Simulate API request
        setTimeout(() => {
          // Hide form, show success message
          newPasswordForm.style.display = 'none';
          successMessage.style.display = 'block';
        }, 1500);
      });
    });
  </script>
</body>
</html>
